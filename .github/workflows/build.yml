name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download AI upscaler model (bundled into the APK)
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/upscaler.onnx \
            https://huggingface.co/jonathanst29/tinier-upscale-models/resolve/main/realesr-general-x4v3.onnx
          ls -lh app/src/main/assets
          test $(stat -c%s app/src/main/assets/upscaler.onnx) -gt 1000000

      - name: Download AI deblur model (optional, tries several sources)
        run: |
          mkdir -p app/src/main/assets
          set +e
          ok=0
          for url in \
            "https://storage.googleapis.com/ailia-models/nafnet/NAFNet-GoPro-width32.onnx" \
            "https://huggingface.co/deepghs/image_restoration/resolve/main/NAFNet-GoPro.onnx"; do
            echo "Trying $url"
            rm -f app/src/main/assets/deblur.onnx
            if curl -L --fail -o app/src/main/assets/deblur.onnx "$url" \
              && [ "$(stat -c%s app/src/main/assets/deblur.onnx)" -gt 5000000 ]; then
              ok=1
              break
            fi
          done
          if [ "$ok" = "1" ]; then
            echo "Deblur model downloaded:"
            ls -lh app/src/main/assets
          else
            rm -f app/src/main/assets/deblur.onnx
            echo "::warning::Deblur model could not be downloaded. The app will use strong sharpen instead."
          fi
          exit 0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NeoEnhancer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
